<button class="tb-hamburger" id="hamburger-btn" aria-label="Buka menu">
  <i class="ph ph-list" aria-hidden="true"></i>
</button>
<div class="tb-search" role="search">
  <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
  <input
    id="search-input"
    type="search"
    placeholder="Cari tugas..."
    aria-label="Cari tugas"
  />
</div>
<div class="tb-spacer"></div>
<div class="tb-bell-wrap">
  <button
    class="tb-icon-btn"
    id="bell-btn"
    aria-label="Notifikasi"
    aria-haspopup="true"
    aria-expanded="false"
  >
    <i class="ph ph-bell" aria-hidden="true"></i>
    <span class="tb-notif-dot" id="notif-dot" aria-hidden="true"></span>
  </button>
  <div
    class="notif-panel"
    id="notif-panel"
    role="menu"
    aria-label="Panel notifikasi"
  >
    <p class="notif-head">Notifikasi</p>
    <div id="notif-list"></div>
  </div>
</div>

<!-- ── Template untuk item notifikasi (diisi via JS di beranda.js) ── -->
<template id="tpl-notif-item">
  <div class="notif-item" data-action="markRead">
    <div data-slot="indicator"></div>
    <div>
      <p class="notif-text" data-slot="text"></p>
      <p class="notif-time" data-slot="time"></p>
    </div>
  </div>
</template>
